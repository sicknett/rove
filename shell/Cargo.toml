[package]
name = "rove"
description = "ROVE: a streaming app for Windows, playing through mpv"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rove"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
libloading = "0.9"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
